name: Compilar CamLivre

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar projeto
        run: bash tool/prepare.sh
      - run: flutter pub get
      - name: Checar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Compilar APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi 2>&1 | tee build.log; then
            msg=$(grep -iE "error|what went wrong|unresolved|failed|exception" -A3 build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Erro no APK::$msg"
            exit 1
          fi
      - name: Renomear APKs
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/CamLivre-Android.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/CamLivre-Android-celular-antigo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    name: App Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar projeto
        shell: bash
        run: bash tool/prepare.sh
      - run: flutter pub get
      - name: Compilar Windows
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build windows --release 2>&1 | tee build.log; then
            msg=$(grep -iE "error|failed" -A3 build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Erro no Windows::$msg"
            exit 1
          fi
      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath CamLivre-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: CamLivre-Windows.zip

  release:
    name: Publicar download
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CamLivre v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Celular Android:** baixe `CamLivre-Android.apk` e instale.
            (Se o celular for muito antigo e não instalar, use `CamLivre-Android-celular-antigo.apk`.)

            **PC Windows:** baixe `CamLivre-Windows.zip`, extraia e abra `camlivre.exe`.
          files: dist/*
